; Azure DevOps settings for adobrowser.py
[azure_devops]
organization = my-organization
project = my-project

; Optional: map commit author names or emails to a common name
; (used by "repos --sort commit"; keys are case-insensitive)
[aliases]
; jd = Jane Doe
; jane@home.example = Jane Doe

; Optional: repos to ignore (names or IDs, case-insensitive,
; separated by commas or one per line)
[blacklist]
; repos = OldArchive
